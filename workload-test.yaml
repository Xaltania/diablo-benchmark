let:
  - &n { sample: !integer { from: 10, to: 10 } }

  - !loop &a { sample: !account { number: *n, stake: 1000000000 } }

  - !loop &l     { sample: !location [ ".*"     ] }

  - !iter &e     { sample: !endpoint [ ".*"     ] }

  - &tps { sample: !float { from: 33.33, to: 33.34 } }
  - &d { sample: !integer { from: 10, to: 10 } }

workloads:
  - number: 1
    client:
      location: *l
      view: *e
      behavior:
        - interaction: !transfer { from: *a, to: *a }
          load: { 0: *tps, *d: 0 }

